<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Expense Tracker{% endblock %}</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            <i class="bi bi-wallet2 me-2"></i>Expense Tracker
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link {% if request.url.path == '/' %}active{% endif %}" href="/">
                        <i class="bi bi-list-ul me-1"></i>All Expenses
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.url.path == '/add' %}active{% endif %}" href="/add">
                        <i class="bi bi-plus-circle me-1"></i>Add Expense
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.url.path == '/summary' %}active{% endif %}" href="/summary">
                        <i class="bi bi-bar-chart-line me-1"></i>Monthly Summary
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container my-4">
    {% block content %}{% endblock %}
</main>

<footer class="text-center text-muted py-3 border-top mt-auto">
    <small>Personal Expense Tracker &mdash; Built with FastAPI &amp; Bootstrap</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
